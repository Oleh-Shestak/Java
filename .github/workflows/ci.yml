name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn test --file lab9-cicd/pom.xml

      - name: Build Fat JAR with Dependencies
        run: mvn package -DskipTests --file lab9-cicd/pom.xml

      - name: Verify JAR Execution
        run: |
          echo "Testing jar execution..."
          java -jar lab9-cicd/target/app-with-dependencies.jar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: lab9-cicd/target/app-with-dependencies.jar
          retention-days: 3